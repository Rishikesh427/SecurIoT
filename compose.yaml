name: securiot
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./api/.env
        required: false
    environment:
      APP_ENV: development
      ROOT_PATH: /api
      SECURIOT_ROUTER_URL: ${SECURIOT_ROUTER_URL:-}
    volumes:
      - ./api:/app/api
      - ./ml/securiot_ml:/app/ml/securiot_ml:ro
    command: >-
      uvicorn api.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
      --reload --reload-dir /app/api --reload-dir /app/ml/securiot_ml
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
  web:
    # Refresh the persistent dependency volume when the checkout's lockfile changes.
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://api:8000
    build:
      context: .
      dockerfile: web/Dockerfile
      target: development
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MOCK_MODE: ${VITE_MOCK_MODE:-false}
    restart: unless-stopped
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    expose:
      - "5173"
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
  web_node_modules:
