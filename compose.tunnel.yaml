# Free temporary public HTTPS; requires Docker Compose 2.24.4+ (!override).
services:
  caddy:
    environment:
      SITE_ADDRESS: ":80"
    ports: !override
      - "127.0.0.1:8080:80"
  tunnel:
    image: cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy
    restart: unless-stopped
